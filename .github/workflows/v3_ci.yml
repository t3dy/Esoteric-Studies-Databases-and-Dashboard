name: V3 Hermetic CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # We need to create the DB schema because library.db is ignored
    - name: Initialize Database Schema
      run: python idempotent_migrate.py

    # Start the FastAPI server in background
    - name: Start Backend Server
      run: |
        nohup python backend.py > backend.log 2>&1 &
        echo "Server starting... waiting 5s"
        sleep 5

    # Run the existing Smoke Test suite against localhost:8000
    - name: Run Smoke Tests
      run: python smoke_test.py
    
    # Debug logs if failure
    - name: Upload Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: backend-logs
        path: backend.log
